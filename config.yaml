# ============================================================
# Все константы модуля. Меняются без правки кода.
# Калибруются онлайн после первых 10-20 реальных прогонов.
# ============================================================

# --- курс и бюджет ---
input_to_output_ratio: 10        # 1 output = 9.5 input (курс с запасом)
budget_output_equiv: 100000        # бюджет в "output-эквивалентах"

# --- константы агентного фреймворка (default, калибровать онлайн) ---
c_sys_in: 500                    # системный промпт (входной)
c_sys_out: 50                     # служебный выход на задачу
avg_tool_call_tokens: 60          # сколько модель пишет в один tool call
reasoning_tokens_per_step: 350    # токены рассуждений на шаг (для reason-моделей)
avg_tool_output_tokens_cap: 1500  # потолок на размер tool result
files_per_grep: 20                # сколько файлов "видит" один grep-проход

# --- время ---
latency_per_step_sec: 3.0
latency_reasoning_bonus_sec: 2.0
fixed_overhead_sec: 5.0

# --- safety margin (снижены: 1.3 было слишком жёстко, отсекало решаемые задачи) ---
safety_margin_output: 1.15
safety_margin_seconds: 1.3

# --- p_solved (prior, пока нет исторических прогонов) ---
# Подняты: 0.85/0.75/0.05 слишком консервативно отсекало через плотность.
p_solved_likely: 0.90
p_solved_uncertain: 0.80
p_solved_unlikely: 0.15         # ловушки почти не берём, но шанс оставляем

# --- рюкзак ---
knapsack_algorithm: dp_exact
knapsack_budget_scale: 1
use_noreason_cost_when_possible: true   # если не нужна рассуждёнка — вес = cost_noreason_safe

# --- планировщик ---
n_agents: 5
time_budget_sec: 3600

# --- фичи ---
max_claims_checked: 20
output_csv: false
